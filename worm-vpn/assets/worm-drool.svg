<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
    <style>
        .worm-wrapper {
            animation: floatWorm 5s infinite ease-in-out;
            transform-origin: center;
        }
        .drool-drip {
            animation: drip 2.5s infinite ease-in;
            transform-origin: top;
        }
        .droplet {
            animation: dropFade 2.5s infinite ease-in;
        }
        @keyframes floatWorm {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes drip {
            0% { transform: scaleY(0.5); opacity: 0.8; }
            80% { transform: scaleY(1.5); opacity: 1; }
            100% { transform: scaleY(0.5); opacity: 0; }
        }
        @keyframes dropFade {
            0% { transform: translateY(0); opacity: 0; }
            75% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(30px); opacity: 0; }
        }
    </style>

    <g class="worm-wrapper">
        <defs>
            <linearGradient id="fluidPink" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffa6c9" />  <stop offset="40%" stop-color="#ff3377" /> <stop offset="85%" stop-color="#b30047" /> <stop offset="100%" stop-color="#660029" />
            </linearGradient>

            <linearGradient id="droolGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="rgba(0, 229, 255, 0.8)" />
                <stop offset="100%" stop-color="rgba(0, 229, 255, 0)" />
            </linearGradient>
        </defs>

        <path d="M 100 20 
                 C 160 20, 190 70, 180 130 
                 C 170 190, 130 230, 80 220 
                 C 30 210, 10 150, 30 90 
                 C 50 30, 60 20, 100 20 Z" 
              fill="url(#fluidPink)" />

        <path d="M 80 30 C 130 35, 160 70, 150 110 C 145 70, 110 40, 60 50 Z" fill="#ffffff" opacity="0.4" filter="blur(2px)"/>

        <path d="M 120 70 Q 150 75 160 95" stroke="#111" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
        <path d="M 125 72 Q 148 76 155 92" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

        <path d="M 140 130 C 150 145, 170 145, 175 125 C 160 135, 145 130, 140 130 Z" fill="#330014" />

        <g transform="translate(155, 138)">
            <path class="drool-drip" d="M 0 0 Q 5 20 -2 40" stroke="url(#droolGlow)" stroke-width="4" stroke-linecap="round" fill="none" />
            <circle class="droplet" cx="-2" cy="45" r="3" fill="#00e5ff" />
        </g>
        
        <path d="M 145 135 Q 148 150 142 160" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>
</svg>
